<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-label="Kinkin Editor - a drop-in rich text editor for React">
  <title>Kinkin Editor - a drop-in rich text editor for React</title>
  <desc>The editor writing a document: text types in line by line, then the slash command menu opens.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0c1526"/>
      <stop offset="55%" stop-color="#101f38"/>
      <stop offset="100%" stop-color="#1a1436"/>
    </linearGradient>
    <radialGradient id="glow" cx="24%" cy="18%" r="54%">
      <stop offset="0%" stop-color="#1c85f5" stop-opacity="0.40"/>
      <stop offset="60%" stop-color="#7c3aed" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#7c3aed" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="mark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#a8cffd"/>
    </linearGradient>
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#020617" flood-opacity="0.55"/>
    </filter>

    <!-- The page area, so the sliding covers below can never spill onto the
         banner background. Static clip: only rendered elements are animated. -->
    <clipPath id="page"><rect x="548" y="73" width="604" height="253"/></clipPath>

    <style>
      /* One 12s loop: five lines type in, the slash menu opens, the document
         clears and it starts again. The stagger lives inside each keyframe set
         rather than in animation-delay, so every line clears on the same beat
         instead of rippling out of sync.

         Each line is typed out by sliding a white cover rect off it, rather than
         by animating a clipPath. When the SVG is rendered as an image element -
         which is how GitHub serves it - animations on elements inside defs never
         tick, so only rendered elements are animated here. */
      .cv, .caret, .gutter, .menu { transform-box: fill-box; }

      .c1 { animation: rv1 12s linear infinite; }
      .c2 { animation: rv2 12s linear infinite; }
      .c3 { animation: rv3 12s linear infinite; }
      .c4 { animation: rv4 12s linear infinite; }
      .c5 { animation: rv5 12s linear infinite; }
      .doc { animation: clear 12s linear infinite; }
      .caret { animation: blink 1.06s steps(1) infinite, track 12s linear infinite; }
      .gutter { animation: gutter 12s linear infinite; }
      .menu { animation: menu 12s ease-out infinite; }

      /* measured widths: 129.7 / 168.2 / 68.6 / 201.7 / 3.7 */
      @keyframes rv1 { 0%, 1.7% { transform: translateX(0); }    13.3%, 84% { transform: translateX(129.7px); } 85%, 100% { transform: translateX(0); } }
      @keyframes rv2 { 0%, 16.7% { transform: translateX(0); }   29.2%, 84% { transform: translateX(168.2px); } 85%, 100% { transform: translateX(0); } }
      @keyframes rv3 { 0%, 32.5% { transform: translateX(0); }   40%,   84% { transform: translateX(68.6px); }  85%, 100% { transform: translateX(0); } }
      @keyframes rv4 { 0%, 43.3% { transform: translateX(0); }   55%,   84% { transform: translateX(219.7px); } 85%, 100% { transform: translateX(0); } }
      @keyframes rv5 { 0%, 58.3% { transform: translateX(0); }   60.8%, 84% { transform: translateX(3.7px); }   85%, 100% { transform: translateX(0); } }

      @keyframes clear { 0%, 80% { opacity: 1; } 85%, 99% { opacity: 0; } 100% { opacity: 1; } }

      /* the caret rides the end of whatever is being typed */
      @keyframes track {
        0%,     1.7%  { transform: translate(0, 0); }
        13.3%, 15.8%  { transform: translate(129.7px, 0); }
        16.7%         { transform: translate(0, 30px); }
        29.2%, 31.6%  { transform: translate(168.2px, 30px); }
        32.5%         { transform: translate(0, 66px); }
        40%,   42.5%  { transform: translate(68.6px, 66px); }
        43.3%         { transform: translate(18px, 92px); }
        55%,   57.5%  { transform: translate(219.7px, 92px); }
        58.3%         { transform: translate(0, 118px); }
        60.8%, 84%    { transform: translate(3.7px, 118px); }
        85%,   100%   { transform: translate(0, 0); }
      }

      /* the block controls sit beside the active block, as they do in the editor */
      @keyframes gutter {
        0%,     1.6%  { opacity: 0; transform: translateY(0); }
        1.7%,  16%    { opacity: 1; transform: translateY(0); }
        16.7%, 31.8%  { opacity: 1; transform: translateY(30px); }
        32.5%, 42.7%  { opacity: 1; transform: translateY(66px); }
        43.3%, 57.7%  { opacity: 1; transform: translateY(92px); }
        58.3%, 84%    { opacity: 1; transform: translateY(118px); }
        85%,  100%    { opacity: 0; transform: translateY(0); }
      }

      @keyframes menu {
        0%,    60.8% { opacity: 0; transform: translateY(6px); }
        63.5%, 82%   { opacity: 1; transform: translateY(0); }
        84%,  100%   { opacity: 0; transform: translateY(0); }
      }

      @keyframes blink { 0%, 50% { opacity: 1; } 51%, 100% { opacity: 0; } }

      @media (prefers-reduced-motion: reduce) {
        .cv, .caret, .gutter, .menu, .doc { animation: none; }
        .c1 { transform: translateX(129.7px); }
        .c2 { transform: translateX(168.2px); }
        .c3 { transform: translateX(68.6px); }
        .c4 { transform: translateX(219.7px); }
        .c5 { transform: translateX(3.7px); }
        .caret { opacity: 1; transform: translate(3.7px, 118px); }
        .gutter { opacity: 1; transform: translateY(118px); }
        .menu { opacity: 1; }
      }
    </style>
  </defs>

  <rect width="1200" height="360" rx="24" fill="url(#bg)"/>
  <rect width="1200" height="360" rx="24" fill="url(#glow)"/>
  <rect x="0.5" y="0.5" width="1199" height="359" rx="23.5" fill="none" stroke="#ffffff" stroke-opacity="0.09"/>

  <!-- identity -->
  <g transform="translate(64 96) scale(0.0673)" fill="url(#mark)">
    <path d="M463 0L481 3L504 12L518 21L540 46L548 62L554 86L553 109L545 134L526 162L256 425L250 440L252 453L259 464L530 735L548 764L554 789L552 813L543 837L528 858L505 877L489 885L459 892L427 892L391 882L360 861L36 537L19 514L9 494L1 464L0 439L4 414L12 392L37 356L363 31L382 17L416 3L463 0Z"/>
    <path d="M1001 0L1020 3L1040 11L1056 22L1072 41L1079 55L1084 76L1082 103L1073 126L1048 157L766 430L755 436L739 435L686 389L642 369L537 367L881 26L909 10L934 2L1001 0Z"/>
    <path d="M598 382L646 393L687 418L1019 750L1035 782L1037 812L1025 846L1004 870L981 884L949 892L887 891L862 884L838 870L614 646L461 498L452 482L454 462L471 437L494 414L520 397L542 388L566 383L598 382Z"/>
  </g>
  <g font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
    <text x="64" y="208" font-size="50" font-weight="700" fill="#ffffff" letter-spacing="-1.1">Kinkin Editor</text>
    <text x="66" y="246" font-size="20" font-weight="500" fill="#9dc2ee">A drop-in rich text editor for React</text>
    <text x="66" y="284" font-size="13" font-weight="500" fill="#6f8db5" letter-spacing="1.4">TIPTAP  ·  MARKDOWN  ·  SLASH COMMANDS  ·  AI ASSIST</text>
  </g>

  <!-- the editor itself -->
  <g font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
    <rect x="548" y="34" width="604" height="292" rx="12" fill="#ffffff" filter="url(#cardShadow)"/>

    <!-- toolbar -->
    <g stroke="#64748b" stroke-width="1.4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <g transform="translate(570 53)"><path d="M-5 -1l3 -3M-5 -1l3 3M-5 -1h7a4.5 4.5 0 0 1 0 9h-4"/></g>
      <g transform="translate(596 53) scale(-1 1)" stroke="#cbd5e1"><path d="M-5 -1l3 -3M-5 -1l3 3M-5 -1h7a4.5 4.5 0 0 1 0 9h-4"/></g>

      <g transform="translate(738 53)"><circle cx="-5" cy="-4" r="1.1" fill="#64748b" stroke="none"/><circle cx="-5" cy="0" r="1.1" fill="#64748b" stroke="none"/><circle cx="-5" cy="4" r="1.1" fill="#64748b" stroke="none"/><path d="M-1 -4h6M-1 0h6M-1 4h6"/></g>
      <g transform="translate(754 53)"><path d="M-3 -1.5l3 3l3 -3"/></g>

      <g transform="translate(900 53)"><path d="M-6 -4h12M-2 0h8M-2 4h8"/><path d="M-6 -1l2 1l-2 1" fill="none"/></g>
      <g transform="translate(954 53)"><path d="M-6 0h12"/></g>
      <g transform="translate(978 53)"><rect x="-6.5" y="-2.6" width="7.5" height="5.2" rx="2.6"/><rect x="-1" y="-2.6" width="7.5" height="5.2" rx="2.6"/></g>

      <g transform="translate(1008 53)"><rect x="-6" y="-5" width="12" height="10" rx="1.6"/><path d="M-6 -1.4h12M-1.6 -5v10"/></g>
      <g transform="translate(1032 53)"><rect x="-6" y="-5" width="12" height="10" rx="1.6"/><circle cx="-2.4" cy="-1.6" r="1.3" fill="#64748b" stroke="none"/><path d="M-6 3.2l4-4 3 3 2-2 3 3"/></g>

      <g transform="translate(1062 53)"><path d="M0 -5v10M-5 0h10"/></g>
    </g>

    <g fill="#64748b">
      <text x="622" y="57" font-size="10" font-weight="700">Aa</text>
      <text x="642" y="57" font-size="11" font-weight="500">Paragraph</text>
      <g stroke="#64748b" stroke-width="1.4" fill="none" stroke-linecap="round" stroke-linejoin="round" transform="translate(706 53)"><path d="M-3 -1.5l3 3l3 -3"/></g>

      <text x="772" y="58" font-size="12.5" font-weight="700">B</text>
      <text x="794" y="58" font-size="12.5" font-weight="600" font-style="italic">I</text>
      <text x="814" y="58" font-size="12.5" font-weight="500">U</text>
      <rect x="813" y="60" width="10" height="1.2" rx="0.6"/>
      <text x="836" y="58" font-size="12.5" font-weight="500">S</text>
      <rect x="834" y="53" width="10" height="1.2" rx="0.6"/>
      <text x="856" y="57.5" font-size="11" font-weight="500" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">&lt;/&gt;</text>
      <text x="916" y="57.5" font-size="11" font-weight="500" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">&lt;/&gt;</text>
    </g>

    <g stroke="#e2e8f0" stroke-width="1">
      <path d="M614 44v18M722 44v18M768 44v18M886 44v18M994 44v18M1048 44v18"/>
    </g>

    <g transform="translate(1084 53)">
      <path d="M0 -5.4l1.3 3.6 3.6 1.3 -3.6 1.3 -1.3 3.6 -1.3 -3.6 -3.6 -1.3 3.6 -1.3z" fill="#3b82f6"/>
      <path d="M5 1.4l.6 1.6 1.6 .6 -1.6 .6 -.6 1.6 -.6 -1.6 -1.6 -.6 1.6 -.6z" fill="#93c5fd"/>
    </g>
    <text x="1096" y="57" font-size="11" font-weight="600" fill="#3b82f6">Ask AI</text>

    <path d="M548 72h604" stroke="#eef2f7" stroke-width="1"/>

    <!-- block controls, beside the active block -->
    <g class="gutter" stroke="#94a3b8" stroke-width="1.3" stroke-linecap="round" opacity="0">
      <g transform="translate(566 104)"><path d="M0 -4v8M-4 0h8"/></g>
      <g fill="#94a3b8" stroke="none" transform="translate(584 104)">
        <circle cx="-1.6" cy="-4" r="1.15"/><circle cx="1.6" cy="-4" r="1.15"/>
        <circle cx="-1.6" cy="0" r="1.15"/><circle cx="1.6" cy="0" r="1.15"/>
        <circle cx="-1.6" cy="4" r="1.15"/><circle cx="1.6" cy="4" r="1.15"/>
      </g>
    </g>

    <!-- the document -->
    <g class="doc">
      <text x="606" y="110" font-size="22" font-weight="700" fill="#1f2937" letter-spacing="-0.4">Kinkin Editor</text>
      <text x="606" y="140" font-size="12.5" fill="#475569">A standalone rich text editor.</text>
      <text x="606" y="176" font-size="15" font-weight="700" fill="#1f2937" letter-spacing="-0.2">Try these</text>
      <circle cx="612" cy="198" r="1.9" fill="#94a3b8"/>
      <text x="624" y="202" font-size="12" fill="#475569">Type / for the slash command menu</text>
      <text x="606" y="228" font-size="12" fill="#475569">/</text>

      <!-- each cover slides right by exactly its line's measured width -->
      <g clip-path="url(#page)" fill="#ffffff">
        <rect class="cv c1" x="606" y="86"  width="540" height="28"/>
        <rect class="cv c2" x="606" y="126" width="540" height="20"/>
        <rect class="cv c3" x="606" y="160" width="540" height="22"/>
        <rect class="cv c4" x="606" y="188" width="540" height="20"/>
        <rect class="cv c5" x="606" y="216" width="540" height="20"/>
      </g>

      <!-- slash command menu; clipped to the page so its shadow cannot spill
           past the card onto the banner background -->
      <g clip-path="url(#page)">
        <g class="menu" opacity="0">
          <rect x="604" y="234" width="232" height="74" rx="9" fill="#ffffff" stroke="#e2e8f0" filter="url(#cardShadow)"/>
          <rect x="608" y="238" width="224" height="22" rx="6" fill="#eff6ff"/>
          <text x="618" y="253" font-size="9.5" font-weight="700" fill="#2563eb">Aa</text>
          <text x="640" y="253" font-size="11.5" font-weight="500" fill="#2563eb">Paragraph</text>

          <text x="618" y="274" font-size="9.5" font-weight="700" fill="#64748b">H1</text>
          <text x="640" y="274" font-size="11.5" font-weight="500" fill="#334155">Heading 1</text>
          <text x="822" y="274" font-size="10" fill="#94a3b8" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">#</text>

          <text x="618" y="295" font-size="9.5" font-weight="700" fill="#64748b">H2</text>
          <text x="640" y="295" font-size="11.5" font-weight="500" fill="#334155">Heading 2</text>
          <text x="822" y="295" font-size="10" fill="#94a3b8" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">##</text>
        </g>
      </g>
    </g>

    <rect class="caret" x="606" y="94" width="2" height="17" rx="1" fill="#2563eb"/>
  </g>
</svg>
